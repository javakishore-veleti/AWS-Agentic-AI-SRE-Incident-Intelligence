server:
  port: 8085

spring:
  application:
    name: inventory-service
  datasource:
    url: jdbc:postgresql://localhost:5432/inventory
    username: sre
    password: sre_local_password
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL:10}
      pool-name: inventory-pool
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate.jdbc.time_zone: UTC

fault:
  response-delay-ms: ${FAULT_DELAY_MS:0}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
