server:
  port: 8085

spring:
  application:
    name: inventory-service
  datasource:
    url: jdbc:postgresql://localhost:5432/inventory
    username: sre
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL:10}
      pool-name: inventory-pool
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate.jdbc.time_zone: UTC

fault:
  response-delay-ms: ${FAULT_DELAY_MS:0}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

observability:
  metrics:
    exporter: ${OBSERVABILITY_METRICS_EXPORTER:prometheus}
  logs:
    exporter: ${OBSERVABILITY_LOGS_EXPORTER:console}
  traces:
    exporter: ${OBSERVABILITY_TRACES_EXPORTER:none}
    otlp-endpoint: ${OBSERVABILITY_TRACES_OTLP_ENDPOINT:http://127.0.0.1:4318/v1/traces}
