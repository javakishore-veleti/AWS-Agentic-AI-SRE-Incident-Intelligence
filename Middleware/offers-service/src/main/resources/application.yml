server:
  port: 8082

spring:
  application:
    name: offers-service
  datasource:
    url: jdbc:postgresql://localhost:5432/offers
    username: sre
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL:10}
      pool-name: offers-pool
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate.jdbc.time_zone: UTC
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 400ms
      connect-timeout: 400ms
      repositories:
        enabled: false

clients:
  catalog-base-url: ${CATALOG_BASE_URL:http://localhost:8081}

security:
  jwt:
    secret: ${JWT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

observability:
  metrics:
    exporter: ${OBSERVABILITY_METRICS_EXPORTER:prometheus}
  logs:
    exporter: ${OBSERVABILITY_LOGS_EXPORTER:console}
  traces:
    exporter: ${OBSERVABILITY_TRACES_EXPORTER:none}
    otlp-endpoint: ${OBSERVABILITY_TRACES_OTLP_ENDPOINT:http://127.0.0.1:4318/v1/traces}
