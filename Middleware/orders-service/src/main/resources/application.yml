server:
  port: 8084

spring:
  application:
    name: orders-service
  datasource:
    url: jdbc:postgresql://localhost:5432/orders
    username: sre
    password: sre_local_password
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL:10}
      pool-name: orders-pool
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate.jdbc.time_zone: UTC

clients:
  offers-base-url: ${OFFERS_BASE_URL:http://localhost:8082}
  inventory-base-url: ${INVENTORY_BASE_URL:http://localhost:8085}

security:
  jwt:
    secret: local-dev-sre-incident-intelligence-jwt-secret-key

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
