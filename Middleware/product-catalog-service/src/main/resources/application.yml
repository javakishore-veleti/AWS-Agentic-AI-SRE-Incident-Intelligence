server:
  port: 8081

spring:
  application:
    name: product-catalog-service
  datasource:
    url: jdbc:postgresql://localhost:5432/product_catalog
    username: sre
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL:10}
      pool-name: catalog-pool
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate.jdbc.time_zone: UTC

clients:
  inventory-base-url: ${INVENTORY_BASE_URL:http://localhost:8085}

security:
  jwt:
    secret: ${JWT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

observability:
  metrics:
    exporter: ${OBSERVABILITY_METRICS_EXPORTER:prometheus}
  logs:
    exporter: ${OBSERVABILITY_LOGS_EXPORTER:console}
  traces:
    exporter: ${OBSERVABILITY_TRACES_EXPORTER:none}
    otlp-endpoint: ${OBSERVABILITY_TRACES_OTLP_ENDPOINT:http://127.0.0.1:4318/v1/traces}
