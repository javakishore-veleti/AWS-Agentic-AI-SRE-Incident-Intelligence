server:
  port: 8081

spring:
  application:
    name: product-catalog-service
  datasource:
    url: jdbc:postgresql://localhost:5432/product_catalog
    username: sre
    password: sre_local_password
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL:10}
      pool-name: catalog-pool
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate.jdbc.time_zone: UTC

clients:
  inventory-base-url: ${INVENTORY_BASE_URL:http://localhost:8085}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
