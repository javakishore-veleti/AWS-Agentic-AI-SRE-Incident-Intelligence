name: Promote main

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Merge a green develop pull request into main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          number="$(gh pr list --base main --head develop --state open --json number --jq '.[0].number // empty')"
          if [ -z "$number" ]; then
            echo "No open pull request from develop into main."
            exit 0
          fi
          if ! gh pr checks "$number"; then
            echo "Pull request #${number} is not green."
            exit 0
          fi
          gh pr merge "$number" --merge
          echo "Merged pull request #${number}."
