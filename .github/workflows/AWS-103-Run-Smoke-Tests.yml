name: AWS-103-Run-Smoke-Tests

"on":
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [dev, stage]
        default: dev
      dry_run:
        type: boolean
        default: true
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      dry_run:
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read

concurrency:
  group: aws-103-smoke-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Read the load balancer name, or stop when dry_run is true
        env:
          ENV: ${{ inputs.environment }}
          DRY: ${{ inputs.dry_run }}
          EXPECTED_ACCOUNT: ${{ vars.AWS_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          account="$(aws sts get-caller-identity --query Account --output text)"
          if [ "$account" != "$EXPECTED_ACCOUNT" ]; then
            echo "The caller account does not match AWS_ACCOUNT_ID."
            exit 1
          fi
          if [ "$DRY" = "true" ]; then
            echo "Dry run only. No request was sent."
            exit 0
          fi
          dns="$(aws cloudformation describe-stacks --stack-name "heddle-${ENV}-008-ingress" --query "Stacks[0].Outputs[?OutputKey=='LoadBalancerDns'].OutputValue" --output text)"
          echo "Load balancer DNS: $dns"
          curl --silent --show-error --output /tmp/heddle-smoke.txt --write-out "catalog_http_status=%{http_code}\n" "http://${dns}/api/products" || true
          echo "The status above is the response from this run. A status was not assumed."
