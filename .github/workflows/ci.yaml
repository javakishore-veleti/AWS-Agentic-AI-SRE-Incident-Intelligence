name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  middleware:
    name: Middleware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Test and package
        working-directory: Middleware
        run: mvn -B test

  investigation-agent:
    name: Investigation agent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Middleware/investigation-agent/requirements.txt
      - name: Install and load the graph
        working-directory: Middleware/investigation-agent
        run: |
          python -m pip install -r requirements.txt
          python -c "from app.main import app"

  portals:
    name: Portals
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        portal: [agentic-ai-admin, ecommerce-portal]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: Portals/${{ matrix.portal }}/package-lock.json
      - name: Install and build
        working-directory: Portals/${{ matrix.portal }}
        run: |
          npm ci
          npm run build
