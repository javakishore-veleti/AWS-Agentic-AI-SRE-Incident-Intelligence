name: Merge pull request after CI passes

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    name: Merge the pull request
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Merge the pull request, then merge develop into main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event.workflow_run.event }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          merge_pr() {
            local number="$1"
            local attempt
            for attempt in 1 2 3 4 5 6; do
              if gh pr merge "$number" --merge; then
                echo "Merged pull request #${number}."
                return 0
              fi
              sleep 10
            done
            echo "Pull request #${number} stayed open."
            return 1
          }
          closing_lines() {
            gh api "repos/${GITHUB_REPOSITORY}/compare/main...develop" --jq '.commits[].commit.message' \
              | sed -n 's/^Merge pull request #\([0-9][0-9]*\).*/\1/p' \
              | while read -r pr; do
                  gh pr view "$pr" --json body --jq .body
                done \
              | sed -n 's/^Fixes #[0-9][0-9]*$/&/p' \
              | awk '!seen[$0]++'
          }
          with_fixes() {
            local body="$1"
            local line
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              case "$body" in
                *"$line"*) ;;
                *) body="${body}"$'\n\n'"${line}" ;;
              esac
            done <<EOF
$(closing_lines)
EOF
            printf '%s\n' "$body"
          }
          merge_develop_into_main() {
            local body="$1"
            local open ahead number current updated
            body="$(with_fixes "$body")"
            open="$(gh pr list --base main --head develop --state open --json number --jq '.[0].number // empty')"
            if [ -n "$open" ]; then
              current="$(gh pr view "$open" --json body --jq .body)"
              updated="$(with_fixes "$current")"
              if [ "$updated" != "$current" ]; then
                gh pr edit "$open" --body "$updated"
              fi
              merge_pr "$open"
              return 0
            fi
            ahead="$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...develop" --jq .ahead_by)"
            if [ "$ahead" = "0" ]; then
              echo "develop has no commits that main does not already have."
              return 0
            fi
            gh pr create --base main --head develop --title "Merge develop into main" --body "$body"
            number="$(gh pr list --base main --head develop --state open --json number --jq '.[0].number')"
            merge_pr "$number"
          }
          if [ "$EVENT" = "pull_request" ]; then
            number="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq '.pull_requests[0].number // empty')"
            if [ -n "$number" ]; then
              base="$(gh pr view "$number" --json baseRefName --jq .baseRefName)"
              state="$(gh pr view "$number" --json state --jq .state)"
              if [ "$state" = "OPEN" ] && { [ "$base" = "develop" ] || [ "$base" = "main" ]; }; then
                merge_pr "$number"
              fi
              if [ "$base" = "develop" ]; then
                merge_develop_into_main "CI passed on the pull request into develop. This pull request carries those commits to main."
              fi
            fi
          fi
          if [ "$EVENT" = "push" ] && [ "$BRANCH" = "develop" ]; then
            merge_develop_into_main "CI passed on develop."
          fi
