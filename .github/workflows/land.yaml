name: Land

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  land:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Merge a green pull request or open the main promotion
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event.workflow_run.event }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          promote() {
            local body="$1"
            local open ahead
            open="$(gh pr list --base main --head develop --state open --json number --jq '.[0].number // empty')"
            if [ -n "$open" ]; then
              echo "Pull request #${open} is already open."
              return 0
            fi
            ahead="$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...develop" --jq .ahead_by)"
            if [ "$ahead" = "0" ]; then
              echo "develop has no commits that main does not already have."
              return 0
            fi
            gh pr create --base main --head develop --title "Promote develop to main" --body "$body"
          }
          if [ "$EVENT" = "pull_request" ]; then
            number="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq '.pull_requests[0].number // empty')"
            if [ -n "$number" ]; then
              base="$(gh pr view "$number" --json baseRefName --jq .baseRefName)"
              state="$(gh pr view "$number" --json state --jq .state)"
              if [ "$state" = "OPEN" ] && { [ "$base" = "develop" ] || [ "$base" = "main" ]; }; then
                gh pr merge "$number" --merge
              fi
              if [ "$base" = "develop" ]; then
                promote "CI passed on the pull request into develop. This pull request carries those commits to main."
              fi
            fi
          fi
          if [ "$EVENT" = "push" ] && [ "$BRANCH" = "develop" ]; then
            promote "CI passed on develop."
          fi
