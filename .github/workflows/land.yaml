name: Land

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  land:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Merge a green pull request or open the main promotion
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event.workflow_run.event }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            number="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq '.pull_requests[0].number')"
            base="$(gh pr view "$number" --json baseRefName --jq .baseRefName)"
            if [ "$base" = "develop" ] || [ "$base" = "main" ]; then
              gh pr merge "$number" --merge
            fi
            if [ "$base" = "develop" ]; then
              open="$(gh pr list --base main --head develop --state open --json number --jq '.[0].number')"
              if [ -z "$open" ]; then
                gh pr create --base main --head develop --title "Promote develop to main" --body "CI passed on the pull request into develop. This pull request carries those commits to main."
              fi
            fi
          fi
          if [ "$EVENT" = "push" ] && [ "$BRANCH" = "develop" ]; then
            open="$(gh pr list --base main --head develop --state open --json number --jq '.[0].number')"
            if [ -z "$open" ]; then
              gh pr create --base main --head develop --title "Promote develop to main" --body "CI passed on develop."
            fi
          fi
