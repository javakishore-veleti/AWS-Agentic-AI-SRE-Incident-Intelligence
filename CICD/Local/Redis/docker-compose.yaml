name: sre-redis

services:
  redis:
    image: redis:7.4-alpine
    container_name: sre-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - sre-incident-net

networks:
  sre-incident-net:
    external: true
    name: sre-incident-net
