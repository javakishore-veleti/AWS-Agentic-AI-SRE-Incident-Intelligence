name: sre-jaeger

services:
  jaeger:
    image: jaegertracing/all-in-one:1.64.0
    container_name: sre-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    networks:
      - sre-incident-net

networks:
  sre-incident-net:
    external: true
    name: sre-incident-net
