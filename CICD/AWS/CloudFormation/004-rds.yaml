AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Private PostgreSQL 16 for Heddle. The instance is not publicly accessible.
  Deleting the stack snapshots the database. The password comes from Secrets
  Manager and is not written in this file.

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, stage]
  Project:
    Type: String
    Default: Heddle
  Owner:
    Type: String
    Default: heddle
  DataSubnet1:
    Type: AWS::EC2::Subnet::Id
  DataSubnet2:
    Type: AWS::EC2::Subnet::Id
  DataSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  DbSecretArn:
    Type: String
  KmsKeyArn:
    Type: String
  DbInstanceClass:
    Type: String
    Default: db.t4g.micro
  EngineVersion:
    Type: String
    Default: "16.4"
  BackupRetentionDays:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 7

Resources:
  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Private data subnets for Heddle PostgreSQL
      SubnetIds:
        - !Ref DataSubnet1
        - !Ref DataSubnet2
      Tags:
        - Key: Name
          Value: !Sub heddle-${Environment}-db-subnets
        - Key: Project
          Value: !Ref Project
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: cloudformation
        - Key: Owner
          Value: !Ref Owner

  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: !Sub heddle-${Environment}-postgres
      Engine: postgres
      EngineVersion: !Ref EngineVersion
      DBInstanceClass: !Ref DbInstanceClass
      AllocatedStorage: 20
      StorageType: gp3
      StorageEncrypted: true
      KmsKeyId: !Ref KmsKeyArn
      MasterUsername: heddle
      MasterUserPassword: !Sub "{{resolve:secretsmanager:${DbSecretArn}:SecretString:password}}"
      DBName: heddle
      Port: 5432
      PubliclyAccessible: false
      MultiAZ: false
      DBSubnetGroupName: !Ref DbSubnetGroup
      VPCSecurityGroups:
        - !Ref DataSecurityGroupId
      BackupRetentionPeriod: !Ref BackupRetentionDays
      CopyTagsToSnapshot: true
      DeletionProtection: false
      Tags:
        - Key: Name
          Value: !Sub heddle-${Environment}-postgres
        - Key: Project
          Value: !Ref Project
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: cloudformation
        - Key: Owner
          Value: !Ref Owner

Outputs:
  DbEndpoint:
    Value: !GetAtt Database.Endpoint.Address
  DbPort:
    Value: !GetAtt Database.Endpoint.Port
  DbName:
    Value: heddle
