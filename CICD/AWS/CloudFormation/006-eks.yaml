AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Heddle EKS cluster and one managed node group in the private app subnets.
  The cluster is not placed in the public or data subnets.

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, stage]
  Project:
    Type: String
    Default: Heddle
  Owner:
    Type: String
    Default: heddle
  KubernetesVersion:
    Type: String
    Default: "1.31"
  AppSubnet1:
    Type: AWS::EC2::Subnet::Id
  AppSubnet2:
    Type: AWS::EC2::Subnet::Id
  AppSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  ClusterRoleArn:
    Type: String
  NodeRoleArn:
    Type: String
  PublicAccessCidrs:
    Type: CommaDelimitedList
    Default: 0.0.0.0/0
  NodeInstanceType:
    Type: String
    Default: t3.medium

Resources:
  Cluster:
    Type: AWS::EKS::Cluster
    Properties:
      Name: !Sub heddle-${Environment}
      Version: !Ref KubernetesVersion
      RoleArn: !Ref ClusterRoleArn
      ResourcesVpcConfig:
        SubnetIds:
          - !Ref AppSubnet1
          - !Ref AppSubnet2
        SecurityGroupIds:
          - !Ref AppSecurityGroupId
        EndpointPrivateAccess: true
        EndpointPublicAccess: true
        PublicAccessCidrs: !Ref PublicAccessCidrs
      Tags:
        - Key: Name
          Value: !Sub heddle-${Environment}
        - Key: Project
          Value: !Ref Project
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: cloudformation
        - Key: Owner
          Value: !Ref Owner

  NodeGroup:
    Type: AWS::EKS::Nodegroup
    Properties:
      ClusterName: !Ref Cluster
      NodegroupName: !Sub heddle-${Environment}-app
      NodeRole: !Ref NodeRoleArn
      Subnets:
        - !Ref AppSubnet1
        - !Ref AppSubnet2
      AmiType: AL2023_x86_64_STANDARD
      CapacityType: ON_DEMAND
      InstanceTypes:
        - !Ref NodeInstanceType
      ScalingConfig:
        MinSize: 1
        DesiredSize: 1
        MaxSize: 2
      DiskSize: 20
      Tags:
        Project: !Ref Project
        Environment: !Ref Environment
        ManagedBy: cloudformation
        Owner: !Ref Owner

Outputs:
  ClusterName:
    Value: !Ref Cluster
  ClusterArn:
    Value: !GetAtt Cluster.Arn
  ClusterEndpoint:
    Value: !GetAtt Cluster.Endpoint
  NodeGroupName:
    Value: !Ref NodeGroup
