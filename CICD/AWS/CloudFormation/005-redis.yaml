AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Private Redis for the offers catalog cache. Encryption is on in transit and
  at rest. The security group is the network boundary. This file has no password.

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, stage]
  Project:
    Type: String
    Default: Heddle
  Owner:
    Type: String
    Default: heddle
  DataSubnet1:
    Type: AWS::EC2::Subnet::Id
  DataSubnet2:
    Type: AWS::EC2::Subnet::Id
  DataSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  KmsKeyArn:
    Type: String
  CacheNodeType:
    Type: String
    Default: cache.t4g.micro

Resources:
  CacheSubnetGroup:
    Type: AWS::ElastiCache::SubnetGroup
    Properties:
      Description: Private data subnets for Heddle Redis
      SubnetIds:
        - !Ref DataSubnet1
        - !Ref DataSubnet2
      Tags:
        - Key: Name
          Value: !Sub heddle-${Environment}-redis-subnets
        - Key: Project
          Value: !Ref Project
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: cloudformation
        - Key: Owner
          Value: !Ref Owner

  Redis:
    Type: AWS::ElastiCache::ReplicationGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      ReplicationGroupId: !Sub heddle-${Environment}-redis
      ReplicationGroupDescription: Offers catalog cache
      Engine: redis
      CacheNodeType: !Ref CacheNodeType
      NumCacheClusters: 1
      AutomaticFailoverEnabled: false
      TransitEncryptionEnabled: true
      AtRestEncryptionEnabled: true
      KmsKeyId: !Ref KmsKeyArn
      Port: 6379
      CacheSubnetGroupName: !Ref CacheSubnetGroup
      SecurityGroupIds:
        - !Ref DataSecurityGroupId
      Tags:
        - Key: Name
          Value: !Sub heddle-${Environment}-redis
        - Key: Project
          Value: !Ref Project
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: cloudformation
        - Key: Owner
          Value: !Ref Owner

Outputs:
  RedisEndpoint:
    Value: !GetAtt Redis.PrimaryEndPoint.Address
  RedisPort:
    Value: !GetAtt Redis.PrimaryEndPoint.Port
