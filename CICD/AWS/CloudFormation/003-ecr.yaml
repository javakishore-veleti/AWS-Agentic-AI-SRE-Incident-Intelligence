  InvestigationRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: !Sub heddle-${Environment}-investigation-agent
      ImageScanningConfiguration:
        ScanOnPush: true
      ImageTagMutability: MUTABLE
      EncryptionConfiguration:
        EncryptionType: AES256
      Tags:
        - Key: Project
          Value: !Ref Project
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: cloudformation
        - Key: Owner
          Value: !Ref Owner

Outputs:
  CatalogRepositoryUri:
    Value: !GetAtt CatalogRepository.RepositoryUri
  OffersRepositoryUri:
    Value: !GetAtt OffersRepository.RepositoryUri
  CustomersRepositoryUri:
    Value: !GetAtt CustomersRepository.RepositoryUri
  OrdersRepositoryUri:
    Value: !GetAtt OrdersRepository.RepositoryUri
  InventoryRepositoryUri:
    Value: !GetAtt InventoryRepository.RepositoryUri
  DeskRepositoryUri:
    Value: !GetAtt DeskRepository.RepositoryUri
  ShopRepositoryUri:
    Value: !GetAtt ShopRepository.RepositoryUri
  InvestigationRepositoryUri:
    Value: !GetAtt InvestigationRepository.RepositoryUri
