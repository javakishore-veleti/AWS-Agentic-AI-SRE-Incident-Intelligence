apiVersion: v1
kind: Namespace
metadata:
  name: heddle

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: heddle-endpoints
  namespace: heddle
data:
  dbHost: replace-at-deploy
  redisHost: replace-at-deploy

---
apiVersion: batch/v1
kind: Job
metadata:
  name: create-databases
  namespace: heddle
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: create
          image: postgres:16
          env:
            - name: PGHOST
              valueFrom:
                configMapKeyRef:
                  name: heddle-endpoints
                  key: dbHost
            - name: PGUSER
              value: heddle
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: heddle-database
                  key: password
          command: ["bash", "-lc"]
          args:
            - |
              set -euo pipefail
              for name in product_catalog offers customers orders inventory; do
                psql -d postgres -v ON_ERROR_STOP=1 -c "SELECT 1 FROM pg_database WHERE datname = '${name}'" | grep -q 1 || psql -d postgres -c "CREATE DATABASE ${name}"
              done

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: heddle
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog
  template:
    metadata:
      labels:
        app: catalog
    spec:
      containers:
        - name: catalog
          image: heddle-catalog:local
          ports:
            - containerPort: 8081
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://$(DB_HOST):5432/product_catalog
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: heddle-endpoints
                  key: dbHost
            - name: SPRING_DATASOURCE_USERNAME
              value: heddle
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: heddle-database
                  key: password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: heddle-jwt
                  key: secret
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
---
apiVersion: v1
kind: Service
metadata:
  name: catalog
  namespace: heddle
spec:
  type: NodePort
  selector:
    app: catalog
  ports:
    - port: 8081
      targetPort: 8081
      nodePort: 30081

