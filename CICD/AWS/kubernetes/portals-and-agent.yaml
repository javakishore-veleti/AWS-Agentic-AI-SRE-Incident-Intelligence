---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: investigation-agent
  namespace: heddle
spec:
  replicas: 1
  selector:
    matchLabels:
      app: investigation-agent
  template:
    metadata:
      labels:
        app: investigation-agent
    spec:
      containers:
        - name: investigation-agent
          image: heddle-investigation-agent:local
          ports:
            - containerPort: 8090
          readinessProbe:
            httpGet:
              path: /health
              port: 8090
---
apiVersion: v1
kind: Service
metadata:
  name: investigation-agent
  namespace: heddle
spec:
  type: NodePort
  selector:
    app: investigation-agent
  ports:
    - port: 8090
      targetPort: 8090
      nodePort: 30090
