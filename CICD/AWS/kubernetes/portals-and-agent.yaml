apiVersion: apps/v1
kind: Deployment
metadata:
  name: desk
  namespace: heddle
spec:
  replicas: 1
  selector:
    matchLabels:
      app: desk
  template:
    metadata:
      labels:
        app: desk
    spec:
      containers:
        - name: desk
          image: heddle-desk:local
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: desk
  namespace: heddle
spec:
  type: NodePort
  selector:
    app: desk
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30073
---
apiVersion: apps/v1
